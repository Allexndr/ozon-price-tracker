version: '3.8'

services:
  ozon-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ozon-price-tracker
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - PYTHONUNBUFFERED=1
